name: Release package

# Pushing an approved version tag builds both packages and update.json
# and attaches it to a draft release. Clients only see the release once it is published,
# so review the bilingual notes before publishing. Manual runs upload workflow artifacts only.
on:
  pull_request:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Source commit to build (blank uses this workflow commit)'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Canonical version to preview (blank builds test packages; no Release is created)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  agent-notes:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Agent Notes
        run: python tools/agent_notes.py check
        env:
          AGENT_NOTES_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  package:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select installed .NET SDK
        shell: pwsh
        env:
          CI_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          $sdkSelection = @{ sdk = @{ version = $env:CI_DOTNET_SDK; rollForward = 'disable' } }
          $sdkSelectionPath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'global.json'
          $sdkSelection | ConvertTo-Json | Set-Content -LiteralPath $sdkSelectionPath -Encoding utf8
          dotnet --version

      - name: Build package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./tools/package-release.ps1 -Output dist -ExpectedVersion $env:RELEASE_TAG

      - name: Checkout release note templates
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_version != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-notes-template
          persist-credentials: false

      - name: Render bilingual release notes
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_version != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
        run: |
          python .release-notes-template/tools/render-release-notes.py --version $env:RELEASE_TAG --repository $env:GITHUB_REPOSITORY --run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --output dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release note rendering failed' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikuN2N-win-x64-packages
          path: |
            dist/MikuN2N-*-win-x64*.zip
            dist/SHA256SUMS
            dist/update.json
            dist/test-build.json
            dist/release-notes.md

      - name: Upload package validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: MikuN2N-package-validation
          path: artifacts/package-checks/**/*.json

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MikuN2N-win-x64-packages
          path: dist

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $package = "dist/MikuN2N-$env:TAG-win-x64.zip"
          $frameworkPackage = "dist/MikuN2N-$env:TAG-win-x64-framework-dependent.zip"
          gh release create $env:TAG $package $frameworkPackage dist/SHA256SUMS dist/update.json --draft --verify-tag `
            --title "MikuN2N $env:TAG" `
            --notes-file dist/release-notes.md
