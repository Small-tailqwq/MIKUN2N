name: Release package

# Pushing an approved version tag builds both packages and update.json
# and attaches it to a draft release. Clients only see the release once it is published,
# so review the draft notes before publishing. Private test builds are never built here.
on:
  pull_request:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-notes:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Agent Notes
        run: python tools/agent_notes.py check
        env:
          AGENT_NOTES_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  package:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./tools/package-release.ps1 -Output dist -ExpectedVersion $env:RELEASE_TAG

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikuN2N-win-x64-packages
          path: |
            dist/MikuN2N-*-win-x64*.zip
            dist/SHA256SUMS
            dist/update.json
            dist/test-build.json

      - name: Create draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $package = "dist/MikuN2N-$env:TAG-win-x64.zip"
          $frameworkPackage = "dist/MikuN2N-$env:TAG-win-x64-framework-dependent.zip"
          gh release create $env:TAG $package $frameworkPackage dist/SHA256SUMS dist/update.json --draft --verify-tag `
            --title "MikuN2N $env:TAG" `
            --notes "Windows x64: self-contained, or framework-dependent (requires .NET 9 Desktop Runtime x64). Both packages include the matching n3n source in Runtime/n3n-3.4.4-source.zip and all licenses; MikuN2N source is the tagged tree. Privacy: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/PRIVACY.md . Removal: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/UNINSTALL.md . Code signing policy (planned, not enabled): https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/CODE_SIGNING.md"
